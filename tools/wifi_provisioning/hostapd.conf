# ==============================================================================
# RISA-Bot hostapd configuration — ap0 (password-protected WPA2-PSK)
# ==============================================================================
interface=ap0
driver=nl80211

# Hotspot Identity
ssid=RISABot-9
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1

# Country (Indonesia)
country_code=ID

# WPA2-PSK Security
auth_algs=1
wpa=2
wpa_passphrase=sunriserisabot9
wpa_key_mgmt=WPA-PSK
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# Beacon / General
beacon_int=100
ignore_broadcast_ssid=0
