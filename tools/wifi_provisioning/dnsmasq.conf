# ==============================================================================
# RISA-Bot dnsmasq configuration — ap0 DHCP + forwarding DNS
#
# This is deliberately NOT a captive portal. The RisaBotApp companion app is the
# only client, so there is no page to redirect anyone to. Clients on the hotspot
# get normal DNS and reach the internet through the MASQUERADE rules that
# backend/app.py:setup_nat() installs on wlan0.
# ==============================================================================

# Bind only to ap0
interface=ap0
bind-interfaces
except-interface=lo

# DHCP pool for hotspot clients
dhcp-range=192.168.4.10,192.168.4.100,255.255.255.0,12h
dhcp-option=3,192.168.4.1        # Default Gateway
dhcp-option=6,192.168.4.1        # DNS Server (this host, forwarding upstream)

# Upstream resolvers — real names resolve to real addresses.
# Previously a wildcard `address=/#/192.168.4.1` hijacked every lookup to force
# the captive popup, which also made the NAT'd internet unusable.
server=8.8.8.8
server=1.1.1.1

# Log DHCP leases
log-dhcp
log-facility=/var/log/risabot_dnsmasq.log
