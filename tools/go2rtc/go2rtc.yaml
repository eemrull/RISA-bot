streams:
  # ros2go2rtc_bridge serves multipart MJPEG here. Use the plain "http" scheme —
  # go2rtc sniffs the content type; there is no "mjpeg:" scheme and it errors with
  # "unsupported scheme" if you use one.
  astra_camera: http://127.0.0.1:1985/mjpeg

api:
  listen: ":1984"

rtsp:
  listen: ":8554"

log:
  level: warn
